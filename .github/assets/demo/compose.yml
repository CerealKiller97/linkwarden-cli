# Throwaway Linkwarden for the demo recordings. record.sh starts it with fresh
# volumes, passes the secrets through the environment, and removes it again.
name: linkwarden-cli-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?}

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:${LINKWARDEN_VERSION:-latest}
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?}
      - NEXTAUTH_URL=http://localhost:${DEMO_PORT:-3200}/api/v1/auth
    ports:
      - "${DEMO_PORT:-3200}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
