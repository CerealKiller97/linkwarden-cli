name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        type: choice
        options: [patch, minor, major]
        required: true

permissions:
  contents: write
  packages: write # push images to ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 🧪 Test
        run: |
          go vet ./...
          go test ./... -race

      - name: 🏷️ Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(scripts/release.sh next-version "$BUMP")"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "🏷️ Releasing v${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Update CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release.sh changelog "$VERSION" --write | tail -n +3 > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔖 Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"

      # Build and render the Homebrew cask, AUR PKGBUILD and winget manifest before pushing,
      # so a failed build leaves no orphan tag or commit behind. Docker images are only built
      # at publish time (dockers_v2), so the Dockerfile is checked in test.yml instead.
      - name: 🔨 Build (dry run)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish,announce

      - name: ⬆️ Push commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push --atomic origin HEAD:main "v${VERSION}"

      # QEMU builds the linux/arm64 image on the amd64 runner.
      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Publishes the GitHub release and the ghcr.io image, and opens
      # PRs against CerealKiller97/homebrew-tap and microsoft/winget-pkgs.
      - name: 🚀 Release and publish packages
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGES_GITHUB_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
