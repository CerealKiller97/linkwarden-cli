name: shellcheck

# Lints the example scripts and install.sh. Runs only when one of them (or this
# workflow) changes; settings live in examples/.shellcheckrc and at the top of
# install.sh.
on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "install.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "examples/**"
      - "install.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        # The official image, pinned, so results don't change with the
        # runner's preinstalled ShellCheck. Every finding fails the job.
        run: |
          docker run --rm -v "${PWD}:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            --severity=style --format=gcc examples/*.sh install.sh
