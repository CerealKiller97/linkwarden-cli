name: shellcheck

# Lints the example scripts. Runs only when something in examples/ (or this
# workflow) changes; settings live in examples/.shellcheckrc.
on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        # The official image, pinned, so results don't change with the
        # runner's preinstalled ShellCheck. Every finding fails the job.
        run: |
          docker run --rm -v "${PWD}:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            --severity=style --format=gcc examples/*.sh
