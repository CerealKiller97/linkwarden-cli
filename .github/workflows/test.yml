name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Releases ship to Linux, macOS (Homebrew) and Windows (winget), and
    # terminal, signal and home-directory handling differ on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -cover
      - name: 📖 README's Go requirement matches go.mod
        if: runner.os == 'Linux'
        run: |
          # "go 1.27" or "go 1.27.1" in go.mod → "1.27"
          want=$(awk '$1 == "go" { split($2, v, "."); print v[1] "." v[2]; exit }' go.mod)
          grep -q "Go ${want}+" README.md || {
            echo "::error file=README.md::README should say 'Go ${want}+' to match go.mod"
            exit 1
          }

      - name: 📚 docs/cli/ matches the commands
        if: runner.os == 'Linux'
        run: |
          go run ./scripts/gendocs
          git add --intent-to-add docs/cli
          git diff --exit-code -- docs/cli || {
            echo "::error::docs/cli/ is out of date: run 'go run ./scripts/gendocs' and commit the result"
            exit 1
          }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 🐳 Build image from source
        run: docker build --target production -t linkwarden-cli:test .
      - name: 🐳 Smoke test
        run: docker run --rm linkwarden-cli:test --version
