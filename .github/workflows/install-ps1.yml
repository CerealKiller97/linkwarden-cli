name: install.ps1

# Lints install.ps1 with PSScriptAnalyzer, then runs it on Windows in both
# Windows PowerShell 5.1 and PowerShell 7 against the latest release: from the
# file, through `iex` like the README one-liner, and -Uninstall. Runs only when
# the script (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - "install.ps1"
      - ".github/workflows/install-ps1.yml"
  pull_request:
    paths:
      - "install.ps1"
      - ".github/workflows/install-ps1.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error, Information
          $findings | Format-Table -AutoSize RuleName, Line, Message | Out-String -Width 200
          if ($findings) {
            exit 1
          }

  install:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Install from the file
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'lw-file'
          .\install.ps1 -Yes -Dir $dir
          if ($LASTEXITCODE -ne 0) {
            throw "install.ps1 exited with $LASTEXITCODE"
          }
          & (Join-Path $dir 'linkwarden.exe') --version
          if (-not (Test-Path (Join-Path $dir 'completions\linkwarden.ps1'))) {
            throw 'no PowerShell completions next to linkwarden.exe'
          }

      - name: Install through iex
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) {
            throw "install.ps1 exited with $LASTEXITCODE"
          }
          if (Get-Command Install-LinkwardenCli -ErrorAction SilentlyContinue) {
            throw 'iex left Install-LinkwardenCli behind in the session'
          }
          & "$env:LOCALAPPDATA\Programs\linkwarden\linkwarden.exe" --version

      - name: A bad version fails with a non-zero exit
        run: |
          .\install.ps1 -Yes -Version 0.0.0 -Dir (Join-Path $env:RUNNER_TEMP 'lw-bad')
          if ($LASTEXITCODE -ne 1) {
            throw "expected exit 1, got $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0

      - name: Uninstall
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'lw-file'
          .\install.ps1 -Uninstall -Yes -Dir $dir
          if (Test-Path (Join-Path $dir 'linkwarden.exe')) {
            throw "linkwarden.exe is still in $dir"
          }
          .\install.ps1 -Uninstall -Yes
          if (Test-Path "$env:LOCALAPPDATA\Programs\linkwarden\linkwarden.exe") {
            throw 'linkwarden.exe is still in LOCALAPPDATA'
          }
