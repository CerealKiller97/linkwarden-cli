# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# 📦 GoReleaser config for linkwarden-cli: https://goreleaser.com
#
# The release workflow (.github/workflows/release.yml) runs this after it has tagged vX.Y.Z.
# Preview a release locally without publishing anything:
#
#   goreleaser release --snapshot --clean
version: 2

project_name: linkwarden-cli

report_sizes: true

before:
  hooks:
    - go mod download
    - scripts/completions.sh

builds:
  - id: linkwarden
    binary: linkwarden
    main: ./cmd/linkwarden
    env:
      - CGO_ENABLED=0
      - CFLAGS=-O3
      - CXXFLAGS=-O3
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/CerealKiller97/linkwarden-cli/cmd.version={{ .Version }}

archives:
  - id: linkwarden
    ids: [linkwarden]
    name_template: "linkwarden_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - completions/*

source:
  enabled: true
  format: tar.gz

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from CHANGELOG.md via `--release-notes`; this is only the fallback.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^(build|chore|ci|docs|style|test)(\\(.*\\))?:"

release:
  github:
    owner: CerealKiller97
    name: linkwarden-cli
  name_template: "v{{ .Version }}"
  mode: keep-existing
  make_latest: true
  prerelease: auto
  skip_upload: false
  include_meta: true
  # A copy of the installer pinned to this release, at releases/download/vX.Y.Z/install.sh.
  extra_files:
    - glob: ./install.sh

# 🐳 docker run --rm -e LINKWARDEN_TOKEN ghcr.io/cerealkiller97/linkwarden-cli links list
# One buildx build per release pushes a linux/amd64 + linux/arm64 manifest. --snapshot builds
# per-platform images locally instead, tagged with an -amd64/-arm64 suffix.
dockers_v2:
  - id: linkwarden-cli
    ids: [linkwarden]
    dockerfile: Dockerfile
    images:
      - ghcr.io/cerealkiller97/linkwarden-cli
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --target=goreleaser-production
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

# 🍺 brew install CerealKiller97/tap/linkwarden-cli
# Pushes the cask to a branch of CerealKiller97/homebrew-tap and opens a PR to its main branch.
homebrew_casks:
  - name: linkwarden-cli
    ids: [linkwarden]
    binaries: [linkwarden]
    description: CLI for the Linkwarden bookmark manager
    homepage: https://github.com/CerealKiller97/linkwarden-cli
    completions:
      bash: completions/linkwarden.bash
      zsh: completions/linkwarden.zsh
      fish: completions/linkwarden.fish
    repository:
      owner: CerealKiller97
      name: homebrew-tap
      branch: "{{ .ProjectName }}-{{ .Version }}"
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: CerealKiller97
          name: homebrew-tap
          branch: main
    commit_msg_template: "chore(linkwarden-cli): update to {{ .Tag }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: auto
    # The binary isn't signed or notarized, so clear the quarantine flag Gatekeeper would block it on.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/linkwarden"]
          end

# 🐧 yay -S linkwarden-cli-bin
# AUR has no pull requests: the PKGBUILD is pushed straight to the package's AUR git repo over SSH.
aurs:
  - name: linkwarden-cli-bin
    ids: [linkwarden]
    description: CLI for the Linkwarden bookmark manager
    homepage: https://github.com/CerealKiller97/linkwarden-cli
    license: AGPL-3.0-only
    maintainers:
      - Stefan Bogdanović <bogdanovicstefan1997@gmail.com>
    provides: [linkwarden-cli]
    conflicts: [linkwarden-cli]
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/linkwarden-cli-bin.git
    commit_msg_template: "Update to {{ .Tag }}"
    commit_author:
      name: Stefan Bogdanović
      email: bogdanovicstefan1997@gmail.com
    skip_upload: auto
    package: |-
      cd "${srcdir}"/linkwarden_*/
      install -Dm755 "./linkwarden" "${pkgdir}/usr/bin/linkwarden"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/linkwarden-cli/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/linkwarden-cli/README.md"
      install -Dm644 "./completions/linkwarden.bash" "${pkgdir}/usr/share/bash-completion/completions/linkwarden"
      install -Dm644 "./completions/linkwarden.zsh" "${pkgdir}/usr/share/zsh/site-functions/_linkwarden"
      install -Dm644 "./completions/linkwarden.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/linkwarden.fish"

# 🪟 winget install CerealKiller97.LinkwardenCLI
# Pushes the manifest to the CerealKiller97/winget-pkgs fork and opens a PR to microsoft/winget-pkgs.
winget:
  - name: linkwarden-cli
    ids: [linkwarden]
    package_identifier: CerealKiller97.LinkwardenCLI
    package_name: Linkwarden CLI
    publisher: CerealKiller97
    publisher_url: https://github.com/CerealKiller97
    short_description: CLI for the Linkwarden bookmark manager
    homepage: https://github.com/CerealKiller97/linkwarden-cli
    license: AGPL-3.0-only
    license_url: https://github.com/CerealKiller97/linkwarden-cli/blob/main/LICENSE
    release_notes_url: https://github.com/CerealKiller97/linkwarden-cli/releases/tag/{{ .Tag }}
    tags: [linkwarden, bookmarks, cli]
    commit_msg_template: "New version: {{ .PackageIdentifier }} {{ .Version }}"
    commit_author:
      name: Stefan Bogdanović
      email: bogdanovicstefan1997@gmail.com
    skip_upload: auto
    repository:
      owner: CerealKiller97
      name: winget-pkgs
      branch: "{{ .ProjectName }}-{{ .Version }}"
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
